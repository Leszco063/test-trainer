# Automatische Prüfung bei jedem Upload (Continuous Integration).
# Ergebnis: Reiter "Actions" im GitHub-Repository – grüner Haken = alles in Ordnung.
name: Prüfen

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  pruefen:
    runs-on: ubuntu-latest
    steps:
      - name: Code holen
        uses: actions/checkout@v4

      - name: Python einrichten
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fragenpool prüfen (gültig und js/fragen.js aktuell)
        run: python tools/export.py --check

      - name: Generatoren, Lernlogik und Offline-Liste testen
        run: node tools/tests.js
